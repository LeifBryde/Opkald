<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telefonliste</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background-color: #000;
    color: #ffff00;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding-bottom: 30px;
}

h1 {
    text-align: center;
    font-size: 36px;
    margin: 10px 0 20px 0;
}

.record {
    border: 3px solid #ffff00;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 15px;
}

.record h2 {
    margin-top: 0;
    font-size: 30px;
    margin-bottom: 15px;
}

.feltlinje {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    min-height: 64px;
    padding: 10px 14px;
    font-size: 32px;
    font-weight: bold;
    border-radius: 10px;
    border: 3px solid #ffff00;
    background-color: #222;
    color: #ffff00;
    letter-spacing: 2px;
}

input:focus {
    outline: 5px solid #ffffff;
    outline-offset: 2px;
}

button {
    width: 100%;
    min-height: 64px;
    border: none;
    border-radius: 10px;
    font-size: 26px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}

button:focus {
    outline: 5px solid white;
}

.btn-gem {
    background-color: #0a7a0a;
    color: white;
}

.btn-eksport {
    background-color: red;
    color: white;
}

.btn-import {
    background-color: #006666;
    color: white;
}

.btn-laes {
    background-color: #004dcc;
    color: white;
}

.btn-ring {
    background-color: #ffcc00;
    color: black;
}

.bottom-buttons {
    position: sticky;
    bottom: 0;
    background: #000;
    padding-top: 10px;
    padding-bottom: env(safe-area-inset-bottom);
    border-top: 2px solid #444;
}

#status {
    text-align: center;
    font-size: 24px;
    margin-top: 15px;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Telefonliste</h1>

<div id="liste"></div>

<div class="bottom-buttons">

<button
type="button"
class="btn-gem"
onclick="gemListe()">
Gem listen
</button>

<button
type="button"
class="btn-eksport"
onclick="eksporterListe()">
Eksporter liste
</button>

<button
type="button"
class="btn-import"
onclick="document.getElementById('importFil').click()">
Importer liste
</button>

<input
type="file"
id="importFil"
accept=".json"
style="display:none"
onchange="importerListe(event)">

<div id="status"></div>

</div>

</div>

<script>

const liste = document.getElementById("liste");

for(let i = 1; i <= 10; i++) {

    liste.innerHTML += `
    <div class="record">

        <h2>Person ${i}</h2>

        <div class="feltlinje">

            <label for="navn${i}">
                Navn
            </label>

            <input
                id="navn${i}"
                type="text"
                maxlength="50">

        </div>

        <div class="feltlinje">

            <label for="telefon${i}">
                Telefonnummer
            </label>

            <input
                id="telefon${i}"
                type="tel"
                inputmode="numeric"
                maxlength="11"
                oninput="formatTelefon(this)">

        </div>

        <button
            type="button"
            class="btn-laes"
            onclick="laesPost(${i})">
            Læs denne post op
        </button>

        <button
            type="button"
            class="btn-ring"
            onclick="ringOp(${i})">
            Ring op
        </button>

    </div>`;
}

function formatTelefon(input) {

    let tal = input.value.replace(/\D/g,'');

    tal = tal.substring(0,8);

    const grupper = tal.match(/.{1,2}/g);

    input.value =
        grupper ? grupper.join(" ") : "";
}

function laesPost(nr) {

    const navn =
        document.getElementById("navn" + nr).value;

    const telefon =
        document.getElementById("telefon" + nr).value;

    let tekst = "";

    if(navn) {
        tekst += "Navn. " + navn + ". ";
    }

    if(telefon) {
        tekst +=
            "Telefonnummer. " +
            telefon.replaceAll(" ", ", ") +
            ".";
    }

    if(tekst === "") {
        tekst = "Denne post er tom.";
    }

    speechSynthesis.cancel();

    const tale =
        new SpeechSynthesisUtterance(tekst);

    tale.lang = "da-DK";

    speechSynthesis.speak(tale);
}

function ringOp(nr) {

    const telefon =
        document.getElementById("telefon" + nr).value;

    const rentNummer =
        telefon.replace(/\D/g,'');

    if(rentNummer.length === 8) {

        window.location.href =
            "tel:" + rentNummer;

    } else {

        alert(
            "Telefonnummeret skal bestå af 8 cifre."
        );
    }
}

function gemListe() {

    const data = [];

    for(let i = 1; i <= 10; i++) {

        data.push({
            navn:
                document.getElementById("navn" + i).value,

            telefon:
                document.getElementById("telefon" + i).value
        });
    }

    localStorage.setItem(
        "telefonliste",
        JSON.stringify(data)
    );

    document.getElementById("status").innerText =
        "Listen er gemt på enheden.";
}

function hentListe() {

    const data =
        JSON.parse(
            localStorage.getItem(
                "telefonliste"
            )
        );

    if(!data) {
        return;
    }

    data.forEach((person,index) => {

        const nr = index + 1;

        if(nr > 10) return;

        document.getElementById(
            "navn" + nr
        ).value =
            person.navn || "";

        document.getElementById(
            "telefon" + nr
        ).value =
            person.telefon || "";
    });
}

function eksporterListe() {

    const data = [];

    for(let i = 1; i <= 10; i++) {

        data.push({
            navn:
                document.getElementById("navn" + i).value,

            telefon:
                document.getElementById("telefon" + i).value
        });
    }

    const json =
        JSON.stringify(data, null, 2);

    const blob =
        new Blob(
            [json],
            { type: "application/json" }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "telefonliste.json";
    a.click();

    URL.revokeObjectURL(url);
}

function importerListe(event) {

    const fil =
        event.target.files[0];

    if(!fil) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        try {

            const data =
                JSON.parse(e.target.result);

            data.forEach((person,index) => {

                const nr = index + 1;

                if(nr > 10) return;

                document.getElementById(
                    "navn" + nr
                ).value =
                    person.navn || "";

                document.getElementById(
                    "telefon" + nr
                ).value =
                    person.telefon || "";
            });

            gemListe();

            document.getElementById("status").innerText =
                "Listen er importeret.";

        } catch {

            alert(
                "Filen kunne ikke læses."
            );
        }
    };

    reader.readAsText(fil);
}

hentListe();

</script>

</body>
</html>
